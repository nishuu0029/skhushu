<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Photos ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        .photos-page {
            min-height: 100vh;
            padding: 150px 6% 80px;
        }

        .photos-heading {
            text-align: center;
            margin-bottom: 60px;
        }

        .photos-heading .small-title {
            color: #f19ab4;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .photos-heading h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(50px, 8vw, 90px);
            font-weight: 400;
            margin: 0;
            background: linear-gradient(135deg, #ffffff, #f19ab4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .photos-heading p {
            color: #b9aab1;
            font-family: "DM Sans", sans-serif;
            margin-top: 15px;
            font-size: 14px;
        }

        .photo-count {
            margin-top: 10px;
            color: #f19ab4;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .photo-grid {
            width: min(1200px, 100%);
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.03);
            cursor: pointer;

            opacity: 0;
            transform: translateY(20px);
            animation: photoShow .7s ease forwards;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition: transform .6s ease;
        }

        .photo-card::after {
            content: "♥";

            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 30px;

            background: rgba(0,0,0,.25);
            opacity: 0;

            transition: .4s;
        }

        .photo-card:hover img {
            transform: scale(1.08);
        }

        .photo-card:hover::after {
            opacity: 1;
        }

        .empty-message {
            display: none;
            text-align: center;
            color: #b9aab1;
            font-family: "DM Sans", sans-serif;
            padding: 50px 20px;
        }

        @keyframes photoShow {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LIGHTBOX */

        .lightbox {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.92);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            opacity: 0;
            visibility: hidden;

            transition: .3s;

            z-index: 9999;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;

            object-fit: contain;

            border-radius: 15px;

            box-shadow: 0 20px 80px rgba(0,0,0,.7);
        }

        .close-lightbox {
            position: absolute;
            top: 25px;
            right: 30px;

            width: 45px;
            height: 45px;

            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;

            background: rgba(255,255,255,.08);
            color: white;

            font-size: 25px;

            cursor: pointer;
        }

        .lightbox-prev,
        .lightbox-next {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 50px;
            height: 50px;

            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.15);

            background: rgba(255,255,255,.08);
            color: white;

            font-size: 25px;

            cursor: pointer;
        }

        .lightbox-prev {
            left: 25px;
        }

        .lightbox-next {
            right: 25px;
        }

        .lightbox button:hover {
            background: rgba(241,154,180,.25);
        }

        @media (max-width: 900px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 650px) {
            .photos-page {
                padding: 130px 15px 60px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .photo-card {
                border-radius: 12px;
            }

            .lightbox {
                padding: 15px;
            }

            .lightbox-prev,
            .lightbox-next {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .lightbox-prev {
                left: 10px;
            }

            .lightbox-next {
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="index.html#story">Our Story</a>
        <a href="index.html#dates">Dates</a>
        <a href="our photos.html">Photos</a>
        <a href="songs.html">Songs</a>
        <a href="index.html#letter">Letter</a>
    </nav>


    <!-- PHOTOS -->

    <main class="photos-page">

        <div class="photos-heading">

            <div class="small-title">
                Our little memories
            </div>

            <h1>
                Our Photos ❤️
            </h1>

            <p>
                Every picture has a little piece of us.
            </p>

            <div class="photo-count" id="photoCount">
                Loading memories...
            </div>

        </div>


        <div class="photo-grid" id="photoGrid"></div>

        <div class="empty-message" id="emptyMessage">
            No photos found yet ❤️
        </div>

    </main>


    <!-- LIGHTBOX -->

    <div class="lightbox" id="lightbox">

        <button class="close-lightbox" id="closeLightbox">
            ×
        </button>

        <button class="lightbox-prev" id="prevPhoto">
            ‹
        </button>

        <img id="lightboxImage" src="" alt="Our memory">

        <button class="lightbox-next" id="nextPhoto">
            ›
        </button>

    </div>


    <script>

        const photoGrid = document.getElementById("photoGrid");
        const photoCount = document.getElementById("photoCount");
        const emptyMessage = document.getElementById("emptyMessage");

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");

        const closeLightbox = document.getElementById("closeLightbox");
        const prevPhoto = document.getElementById("prevPhoto");
        const nextPhoto = document.getElementById("nextPhoto");


        let photos = [];
        let currentPhoto = 0;


        /*
            GitHub Pages cannot directly read the contents
            of a folder.

            So this checks photo1.jpg, photo2.jpg, photo3.jpg...
            and stops when the next photo doesn't exist.

            There is NO 50/100 photo limit here.
        */


        function checkPhoto(number) {

            return new Promise((resolve) => {

                const img = new Image();

                const fileName = "our photos/photo" + number + ".jpg";

                img.onload = function () {

                    resolve({
                        number: number,
                        src: fileName
                    });

                };

                img.onerror = function () {

                    resolve(null);

                };

                img.src = fileName + "?v=" + Date.now();

            });

        }


        async function loadPhotos() {

            photoGrid.innerHTML = "";

            photos = [];

            let number = 1;

            while (true) {

                const result = await checkPhoto(number);

                if (!result) {
                    break;
                }

                photos.push(result);

                number++;

            }


            if (photos.length === 0) {

                emptyMessage.style.display = "block";

                photoCount.textContent = "0 memories";

                return;
            }


            emptyMessage.style.display = "none";


            photoCount.textContent =
                photos.length +
                (photos.length === 1 ? " memory" : " memories");


            photos.forEach((photo, index) => {

                const card = document.createElement("div");

                card.className = "photo-card";

                card.style.animationDelay =
                    Math.min(index * 0.03, 1) + "s";


                const img = document.createElement("img");

                img.src = photo.src;

                img.alt = "Our memory " + photo.number;

                img.loading = "lazy";


                card.appendChild(img);

                photoGrid.appendChild(card);


                card.addEventListener("click", () => {

                    openLightbox(index);

                });

            });

        }


        function openLightbox(index) {

            currentPhoto = index;

            lightboxImage.src =
                photos[currentPhoto].src;

            lightbox.classList.add("active");

            document.body.style.overflow = "hidden";

        }


        function closeBox() {

            lightbox.classList.remove("active");

            document.body.style.overflow = "";

        }


        function showPrevious() {

            if (!photos.length) return;

            currentPhoto--;

            if (currentPhoto < 0) {

                currentPhoto =
                    photos.length - 1;

            }

            lightboxImage.src =
                photos[currentPhoto].src;

        }


        function showNext() {

            if (!photos.length) return;

            currentPhoto++;

            if (currentPhoto >= photos.length) {

                currentPhoto = 0;

            }

            lightboxImage.src =
                photos[currentPhoto].src;

        }


        closeLightbox.addEventListener(
            "click",
            closeBox
        );


        prevPhoto.addEventListener(
            "click",
            showPrevious
        );


        nextPhoto.addEventListener(
            "click",
            showNext
        );


        lightbox.addEventListener("click", (e) => {

            if (e.target === lightbox) {

                closeBox();

            }

        });


        document.addEventListener("keydown", (e) => {

            if (!lightbox.classList.contains("active")) {
                return;
            }


            if (e.key === "Escape") {

                closeBox();

            }


            if (e.key === "ArrowLeft") {

                showPrevious();

            }


            if (e.key === "ArrowRight") {

                showNext();

            }

        });


        loadPhotos();

    </script>

</body>
</html>
