<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Songs ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">


    <style>

        .songs-page {
            min-height: 100vh;
            padding: 150px 20px 80px;
        }


        .songs-heading {
            text-align: center;
            margin-bottom: 55px;
        }


        .songs-heading .small-title {
            color: #f19ab4;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }


        .songs-heading h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(50px, 8vw, 90px);
            font-weight: 400;
            margin: 0;

            background: linear-gradient(
                135deg,
                #ffffff,
                #f19ab4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .songs-heading p {
            color: #b9aab1;
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            margin-top: 15px;
        }


        .songs-container {
            width: min(850px, 100%);
            margin: auto;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        .song-card {
            display: flex;
            align-items: center;
            gap: 20px;

            padding: 20px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 20px;

            background: rgba(255,255,255,.035);

            backdrop-filter: blur(15px);

            transition: .3s;
        }


        .song-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(241,154,180,.35);

            background:
                rgba(241,154,180,.06);
        }


        .song-number {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(241,154,180,.12);

            color: #f19ab4;

            font-family: "DM Sans", sans-serif;
            font-size: 13px;
        }


        .song-info {
            flex: 1;
            min-width: 0;
        }


        .song-info h3 {
            margin: 0 0 5px;

            color: #fff;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 25px;
            font-weight: 600;

            word-break: break-word;
        }


        .song-info p {
            margin: 0;

            color: #9e8d95;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 12px;
        }


        .song-player {
            width: 300px;
            max-width: 40%;
        }


        .song-player audio {
            width: 100%;
            height: 38px;
        }


        .song-heart {
            color: #f19ab4;
            font-size: 22px;
        }


        .songs-note {
            text-align: center;

            margin-top: 50px;

            color: #8f7e86;

            font-family:
                "Great Vibes",
                cursive;

            font-size: 27px;
        }


        .loading {
            text-align: center;

            color: #b9aab1;

            font-family:
                "DM Sans",
                sans-serif;

            padding: 30px;
        }


        .error-message {
            text-align: center;

            color: #f19ab4;

            font-family:
                "DM Sans",
                sans-serif;

            padding: 30px;
        }


        @media (max-width: 700px) {

            .songs-page {
                padding: 130px 15px 60px;
            }


            .song-card {
                flex-wrap: wrap;
                gap: 14px;
                padding: 16px;
            }


            .song-info {
                min-width:
                    calc(100% - 75px);
            }


            .song-player {
                width: 100%;
                max-width: 100%;
                padding-left: 0;
            }

        }

    </style>

</head>


<body>

    <nav class="navbar">

    <!-- =========================
         SONGS
    ========================= -->

    <main class="songs-page">


        <div class="songs-heading">

            <div class="small-title">
                Our little playlist
            </div>


            <h1>
                Our Songs ❤️
            </h1>


            <p>
                Songs that remind me of you, us, and every little moment.
            </p>

        </div>



        <div
            class="songs-container"
            id="songsContainer"
        >

            <div class="loading">
                Loading our songs ❤️
            </div>

        </div>



        <div class="songs-note">

            "Every love story has a soundtrack... ❤️"

        </div>


    </main>



    <!-- =========================
         AUTOMATIC SONG LOADER
    ========================= -->

    <script>

const GITHUB_USERNAME = "nishuu0029";
const GITHUB_REPOSITORY = "skhushu";
const SONG_FOLDER = "songs";


async function loadSongs() {

    const container = document.getElementById("songsContainer");

    try {

        const apiURL =
            `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${SONG_FOLDER}`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("GitHub folder could not be loaded.");
        }

        const files = await response.json();


        // Sirf MP3 files
        const songs = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".mp3")
        );


        // Alphabetical / numerical order
        songs.sort((a, b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
        );


        container.innerHTML = "";


        if (songs.length === 0) {

            container.innerHTML = `
                <div class="error-message">
                    No songs found ❤️
                </div>
            `;

            return;
        }


        songs.forEach((song, index) => {

            // File name se .mp3 remove
            let title = song.name.replace(/\.mp3$/i, "");


            // _ aur - ko space mein convert
            title = title.replace(/[_-]+/g, " ");


            // First letter capital
            title =
                title.charAt(0).toUpperCase() +
                title.slice(1);


            const card = document.createElement("div");

            card.className = "song-card";


            /*
                IMPORTANT:
                GitHub API download_url ki jagah
                website ke songs folder ka direct path
                use kar rahe hain.
            */

            const songURL =
                `${SONG_FOLDER}/${encodeURIComponent(song.name)}`;


            card.innerHTML = `

                <div class="song-number">
                    ${String(index + 1).padStart(2, "0")}
                </div>


                <div class="song-info">

                    <h3>
                        ${escapeHTML(title)}
                    </h3>

                    <p>
                        A song that belongs to us ❤️
                    </p>

                </div>


                <div class="song-player">

                    <audio
                        controls
                        preload="metadata"
                    >

                        <source
                            src="${songURL}"
                            type="audio/mpeg"
                        >

                        Your browser does not support audio.

                    </audio>

                </div>


                <div class="song-heart">
                    ♥
                </div>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Songs loading error:",
            error
        );


        container.innerHTML = `

            <div class="error-message">

                Songs load nahi ho paaye ❤️

                <br><br>

                GitHub settings check karo.

            </div>

        `;

    }

}


/*
    Security:
    Song title ko safely display karta hai.
*/

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/*
    EK TIME PAR SIRF EK SONG CHALEGA
*/

document.addEventListener(
    "play",
    function(event) {

        if (event.target.tagName === "AUDIO") {

            document.querySelectorAll("audio").forEach(
                function(audio) {

                    if (audio !== event.target) {

                        audio.pause();

                        audio.currentTime = 0;

                    }

                }
            );

        }

    },
    true
);


/*
    START
*/

loadSongs();

</script>
